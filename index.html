<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms Implementation Assignment</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: aqua;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 380px;
            padding: 30px;
            border: 2px solid black;
            border-radius: 15px;
            background-color: white;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="search"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
        }

        input[type="submit"] {
            padding: 10px 20px;
            cursor: pointer;
        }

        #output {
            margin-top: 15px;
            padding: 12px;
            border: 1px solid black;
            background-color: #f5f5f5;
            min-height: 40px;
            word-wrap: break-word;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Form Details</h1>

        <form id="userForm">
            <label for="name">Name:</label>
            <input type="text" id="name" placeholder="Enter Name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="Enter Email" required>

            <label for="mobile">Mobile:</label>
            <input type="tel" id="mobile" placeholder="Enter Mobile" required>

            <input type="submit" value="Submit">
        </form>

        <br>

        <label for="searchBox"><b>Search Box:</b></label>
        <input type="search" id="searchBox"
               placeholder="Submitted data will appear here"
               readonly>

        <div id="output">No data submitted yet.</div>
    </div>

    <script>
        // Store submitted form data in an array.
        let submittedData = [];

        // Capture the form submission event.
        document.getElementById("userForm").addEventListener("submit", function(event) {

            // Prevent the default form submission/page reload.
            event.preventDefault();

            // Store the submitted data in a variable.
            let formData =
                "Name: " + document.getElementById("name").value +
                " | Email: " + document.getElementById("email").value +
                " | Mobile: " + document.getElementById("mobile").value;

            // Add the submitted data to the array.
            submittedData[submittedData.length] = formData;

            // Update the search box dynamically.
            document.getElementById("searchBox").value = formData;

            // Display the submitted data in the output area.
            document.getElementById("output").textContent = formData;
        });
    </script>
</body>
</html>
